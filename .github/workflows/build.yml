name: Build

# Every push to main publishes an unsigned Macapad.zip as a GitHub release numbered
# v<VERSION_PREFIX>.<run number> (like RustySound), then tells AD-Archer/homebrew-tap
# to update its cask. Pushing a tag like v1.0.0 releases that exact version instead.
# Pull requests only build, to check the app compiles.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump this for a new minor/major line; the patch number is the run number.
  VERSION_PREFIX: "0.3"

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a release halfway; only superseded PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_PREFIX}.${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Version: ${TAG}"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build Macapad.app (unsigned)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh

      - name: Zip the app
        # ditto keeps the bundle's symlinks, permissions and ad-hoc signature intact.
        run: ditto -c -k --keepParent build/Macapad.app build/Macapad.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macapad-${{ steps.version.outputs.version }}
          path: build/Macapad.zip

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" build/Macapad.zip --clobber
          else
            # Creates the tag on this commit. Tags made with GITHUB_TOKEN don't start another run.
            gh release create "${TAG}" build/Macapad.zip --target "${GITHUB_SHA}" --title "Macapad ${TAG}" --generate-notes
          fi

      - name: Update Homebrew tap
        if: github.event_name == 'push'
        env:
          DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "CROSS_REPO_DISPATCH_TOKEN is not set; skipping the Homebrew tap update."
            exit 0
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            "https://api.github.com/repos/AD-Archer/homebrew-tap/dispatches" \
            -d "{\"event_type\":\"macapad-release\",\"client_payload\":{\"version\":\"${TAG}\",\"source_repo\":\"${GITHUB_REPOSITORY}\",\"source_sha\":\"${GITHUB_SHA}\"}}"
